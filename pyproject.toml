[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-core"
dynamic = ["version"]
description = "Mesh Networking utilities for OpenVoiceOS"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "jarbasAI", email = "jarbasai@mailfence.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click",
    "click_default_group",
    "rich",
    "pycryptodomex",
    "poorman-handshake>=1.0.1,<2.0.0",
    # >=0.9.2a1: first release with QUERY-stream handling AND ovos-bus-client>=2.0.0a3
    "hivemind_bus_client>=0.9.2a1,<1.0.0",
    "ovos_utils>=0.0.33,<1.0.0",
    "pybase64",
    "hivemind-plugin-manager>=0.7.1a1,<1.0.0",
    "ovos-bus-client>=2.0.0a3",
    "json-database>=0.10.2a1,<1.0.0",
    # client-database backends shipped by default: SQLite (the default for
    # fresh installs) and JSON (kept for existing deployments / opt-in).
    # >=…a2: the json->sqlite client-migration fix (test_db_default).
    "hivemind-sqlite-database>=0.4.0a2",
    "hivemind-json-db-plugin>=0.0.3a2",
    "hivemind-websocket-protocol>=0.0.3,<1.0.0",
    # default agent_protocol (see config.py): the OVOS bridge + OVOSAgentPolicy
    # that the admission logic moved into (#85) now live in this standalone
    # plugin; ship it so a fresh install has a working default agent + policy.
    # Lightweight (no ovos-core); the 0.3.x line requires ovos-bus-client>=2.0.0a3.
    "hivemind-ovos-agent-plugin>=0.3.1a1,<1.0.0",
    "setuptools",
]

[project.optional-dependencies]
# hivescope (in-process e2e harness) is a TEST dependency, used by tests/e2e/.
# Pinning the prerelease floor here lets pip resolve it (and the whole 2.x
# stack) from the package metadata — CI installs `.[test]`, no pre_install pins.
test = ["pytest", "pytest-cov", "hivescope>=0.5.0a2"]
# Alias so gh-automations' `pip install -e ".[dev]"` first-attempt path
# resolves; without it the workflow falls through to a buggy
# `pip install test` literal branch.
dev = ["pytest", "pytest-cov", "hivescope>=0.5.0a2"]
# Live-OVOS integration extra (boots a real ovos-core via ovoscope). Only the
# manual integration_tests job uses it; blocked until ovos-core ships
# ovos-bus-client 2.x support.
integration = ["hivescope>=0.5.0a2", "ovoscope", "ovos-core>=2.1.0", "ovos-skill-hello-world"]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/HiveMind-core"

[project.scripts]
hivemind-core = "hivemind_core.scripts:hmcore_cmds"

[project.entry-points."hivemind.policy"]
"hivemind-message-type-acl-policy" = "hivemind_core.policy:MessageTypeACLPolicy"
"hivemind-deny-all-policy" = "hivemind_core.policy:DenyAllPolicy"

[tool.setuptools]
packages = ["hivemind_core"]

[tool.setuptools.dynamic]
version = {attr = "hivemind_core.version.__version__"}
