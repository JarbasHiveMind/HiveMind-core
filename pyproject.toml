[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-core"
dynamic = ["version"]
description = "Mesh Networking utilities for OpenVoiceOS"
readme = "README.md"
license = {text = "AGPL-3.0"}
authors = [
    {name = "jarbasAI", email = "jarbasai@mailfence.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click",
    "click_default_group",
    "rich",
    "pycryptodomex",
    "poorman-handshake>=1.0.1,<2.0.0",
    "hivemind_bus_client>=0.7.0a2,<1.0.0",
    "ovos_utils>=0.0.33,<1.0.0",
    "pybase64",
    # NOTE: floor stays at 0.5.0 while #27 is in CI as a branch install
    # (gh-automations only bumps version.py on merge to dev). Tighten
    # to >=0.6.0a1 once #27 is released.
    "hivemind-plugin-manager>=0.5.0,<1.0.0",
    "ovos-bus-client>=1.3.1,<2.0.0",
    "json-database>=0.9.1,<1.0.0",
    "hivemind-websocket-protocol>=0.0.3,<1.0.0",
    "setuptools",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
# Alias so gh-automations' `pip install -e ".[dev]"` first-attempt path
# resolves; without it the workflow falls through to a buggy
# `pip install test` literal branch.
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/HiveMind-core"

[project.scripts]
hivemind-core = "hivemind_core.scripts:hmcore_cmds"

[project.entry-points."hivemind.policy"]
"hivemind-message-type-acl-policy" = "hivemind_core.policy:MessageTypeACLPolicy"
"hivemind-deny-all-policy" = "hivemind_core.policy:DenyAllPolicy"

[tool.setuptools]
packages = ["hivemind_core"]

[tool.setuptools.dynamic]
version = {attr = "hivemind_core.version.__version__"}
