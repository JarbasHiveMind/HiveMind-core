name: Integration Tests (live OVOS)

# Heavy live-OVOS e2e (ovoscope/MiniCroft boots a real OVOS stack).
#
# TEMPORARILY manual-only: no released ovos-core yet supports
# ovos-bus-client>=2.0.0a3 (2.1.x pins bus-client<2.0.0), so the `integration`
# extra is unresolvable under this PR's bus-client 2.x requirement. Re-enable
# the pull_request trigger once ovos-core ships a 2.x-compatible release.
on:
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.11"]'
      system_deps: 'python3-dev swig'
      install_extras: 'integration'
      test_path: 'tests/e2e/test_query_ovoscope_e2e.py'
