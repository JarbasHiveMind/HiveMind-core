name: Integration Tests (live OVOS)

# Heavy live-OVOS e2e (ovoscope/MiniCroft boots a real OVOS stack). Kept out of
# the fast build_tests so normal PRs stay quick; runs here on PRs + on demand.
on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.11"]'
      system_deps: 'python3-dev swig'
      # the streaming stack + a real OVOS (ovos-core) + ovoscope + one test skill
      # Bootstrap self-pin of core to this branch (see build_tests.yml) — no
      # published core alpha carries the ovos-bus-client>=2.0.0a3 pin yet.
      # ovos-core floored to >=2.1.0: under ovos-bus-client>=2.0.0a3 an unpinned
      # ovos-core makes pip backtrack to ancient 0.0.x whose legacy sdists fail
      # to build (setuptools `_get_unpatched`). 2.1.x carries no bus-client pin.
      pre_install_pip: '"hivemind-core @ git+https://github.com/JarbasHiveMind/HiveMind-core.git@fix/pin-ovos-bus-client" "ovoscope" "ovos-core>=2.1.0" "ovos-skill-hello-world" "hivescope==0.5.0a2" "hivemind-plugin-manager==0.7.1a1" "hivemind-ovos-agent-plugin==0.3.1a1"'
      test_path: 'tests/e2e/test_query_ovoscope_e2e.py'
