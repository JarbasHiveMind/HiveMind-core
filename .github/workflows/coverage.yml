name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    with:
      python_version: '3.11'
      coverage_source: 'hivemind_core'
      test_path: 'tests/e2e/'
      # TEMPORARY: drop the branch pins once hivemind-plugin-manager#27
      # and hivemind-ovos-agent-plugin#3 are released to PyPI.
      pre_install_pip: '"hivescope @ git+https://github.com/JarbasHiveMind/hivescope@feat/drop-dead-acl-caches" "hivemind-plugin-manager @ git+https://github.com/JarbasHiveMind/hivemind-plugin-manager@feat/policy-plugins" "hivemind-ovos-agent-plugin @ git+https://github.com/JarbasHiveMind/hivemind-ovos-agent-plugin@feat/ovos-agent-policy"'
