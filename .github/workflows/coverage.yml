name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    with:
      python_version: '3.11'
      coverage_source: 'hivemind_core'
      test_path: 'tests/e2e/'
      # Pinned to released PyPI prereleases; drop once these ship stable.
      pre_install_pip: '"hivemind-bus-client==0.9.2a1" "hivescope==0.5.0a1" "hivemind-plugin-manager==0.7.0a1" "hivemind-ovos-agent-plugin==0.3.0a1" "hivemind-sqlite-database==0.4.0a1" "hivemind-json-db-plugin==0.0.3a1"'
