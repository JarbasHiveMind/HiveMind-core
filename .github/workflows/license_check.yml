name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      # The package itself ships under AGPL — exclude it from the
      # downstream-licence audit to avoid self-flagging.
      # Use the same pattern shape the upstream action's docs recommend.
      exclude_packages: '(?i)^hivemind[-_]core.*'
