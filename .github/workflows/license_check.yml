name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      # The package itself ships under AGPL — exclude it from the
      # downstream-licence audit to avoid self-flagging.
      # Exclude both dash + underscore variants (pip-licenses normalizes
      # inconsistently) without anchors so version suffixes don't matter.
      exclude_packages: '^(hivemind-core|hivemind_core)'
