name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # TEMP: pin hivemind-bus-client to the feature branch carrying the
      # protocol fix until that PR (#112) lands and a release ships.
      - name: Install bus-client from feature branch
        run: pip install "hivemind-bus-client @ git+https://github.com/JarbasHiveMind/hivemind-websocket-client@feat/hivescope-e2e"
      - name: Install package and pytest
        run: |
          pip install -e .
          pip install pytest
      - name: Run unit tests
        run: pytest test/ -v

  e2e_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # TEMP: pin hivemind-bus-client to the feature branch carrying the
      # protocol fix until that PR (#112) lands and a release ships.
      - name: Install bus-client from feature branch
        run: pip install "hivemind-bus-client @ git+https://github.com/JarbasHiveMind/hivemind-websocket-client@feat/hivescope-e2e"
      - name: Install package
        run: pip install .
      - name: Install hivescope
        run: pip install "hivescope @ git+https://github.com/JarbasHiveMind/hivescope@dev"
      - name: Run E2E Tests
        run: pytest tests/e2e/ -v
