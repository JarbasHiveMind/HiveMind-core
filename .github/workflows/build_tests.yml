name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      # TEMPORARY: drop the hivemind-plugin-manager + ovos-agent-plugin
      # branch pins once #27 (policy primitives) and #3 (OVOSAgentPolicy)
      # are released to PyPI. Tracking: #85.
      pre_install_pip: '"hivescope==0.2.2a1" "hivemind-plugin-manager==0.6.0a1" "hivemind-ovos-agent-plugin==0.2.0a1"'
      test_path: 'tests/'
